<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streukreis App - Eiserne Basisversion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .upload-section, .settings-section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
        }
        .upload-section {
            border: 2px dashed #ccc;
            text-align: center;
        }
        .settings-section label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #fff;
        }
        .status {
            font-style: italic;
            color: #666;
        }
        #imageContainer {
            position: relative;
            display: block;
            max-width: 100%;
            margin-top: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #eaeaea; 
            min-width: 320px;
            min-height: 240px;
        }
        #targetImage {
            display: none;
            max-width: 100%;
            height: auto;
            user-select: none;
            -webkit-user-drag: none;
        }
        .shot-marker {
            position: absolute;
            background-color: rgba(255, 0, 0, 0.4); 
            border: 2px solid #ff0000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; 
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        button:hover {
            background-color: #bd2130;
        }
        .evaluation {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📷 Streukreis App - Basisversion</h1>
    
    <div class="upload-section">
        <input type="file" id="fileUpload" accept="image/*">
        <p class="status">Status: <span id="statusText">Warte auf Bildauswahl...</span></p>
    </div>

    <div class="settings-section">
        <label for="caliberSelect">🎯 Geschossdurchmesser wählen (nach C.I.P.):</label>
        <select id="caliberSelect">
            <optgroup label="Standard- & Jagdkaliber (7.62mm / .30)">
                <option value="7.85" selected>.308 Win / .30-06 / .300 WM (C.I.P. d=7.85mm)</option>
                <option value="7.92">7.62x39mm (z.B. .311 / d=7.92mm)</option>
                <option value="8.22">8x57 IS / IRS - 8.22mm</option>
            </optgroup>
            <optgroup label="Kleinkaliber / Airgun">
                <option value="4.50">4.5 mm / .177 (z.B. Diabolo) - 4.50mm</option>
            </optgroup>
            <optgroup label="Zentralfeuer Kleinkaliber (5.6mm / .22)">
                <option value="5.69">.223 Rem / 5.56x45mm NATO - 5.69mm</option>
            </optgroup>
            <optgroup label="Mittelkaliber (6mm bis 7mm)">
                <option value="6.71">6.5 Creedmoor / 6.5x55 SE - 6.71mm</option>
            </optgroup>
        </select>
    </div>

    <div id="imageContainer">
        <img id="targetImage" src="" alt="Hier erscheint deine Zielscheibe">
    </div>

    <div class="controls">
        <button id="deleteLastClick">Letzten Klick löschen</button>
    </div>

    <div class="evaluation">
        <h3>📊 Auswertung</h3>
        <p>Anzahl markierte Schüsse: <strong id="shotCounter">0</strong></p>
        <p>Aktuell gewähltes Kaliber: <strong id="currentCaliberDisplay">7.85 mm</strong></p>
    </div>
</div>

<script>
    const fileUpload = document.getElementById('fileUpload');
    const targetImage = document.getElementById('targetImage');
    const imageContainer = document.getElementById('imageContainer');
    const shotCounter = document.getElementById('shotCounter');
    const deleteLastClick = document.getElementById('deleteLastClick');
    const statusText = document.getElementById('statusText');
    const caliberSelect = document.getElementById('caliberSelect');
    const currentCaliberDisplay = document.getElementById('currentCaliberDisplay');

    let shots = [];
    let imageLoaded = false; 

    const PX_PER_MM_CONSTANT = 4; 

    function getMarkerPixelSize(caliberValue) {
        return caliberValue * PX_PER_MM_CONSTANT;
    }

    caliberSelect.addEventListener('change', function() {
        currentCaliberDisplay.textContent = caliberSelect.value + " mm";
        updateMarkerSizes();
    });

    function updateMarkerSizes() {
        const currentCaliber = parseFloat(caliberSelect.value);
        const pixelSize = getMarkerPixelSize(currentCaliber);
        const markers = imageContainer.querySelectorAll('.shot-marker');
        markers.forEach(marker => {
            marker.style.width = pixelSize + 'px';
            marker.style.height = pixelSize + 'px';
        });
    }

    // --- LOKALER UPLOAD ---
    fileUpload.addEventListener('change', function(e) {
        if (e.target.files && e.target.files[0]) { 
            const reader = new FileReader();
            
            reader.onload = function(event) {
                targetImage.src = event.target.result;
                targetImage.style.display = 'block'; 
                statusText.textContent = "Bild erfolgreich geladen. Markiere die Treffer!";
                imageLoaded = true;
                
                shots = [];
                shotCounter.textContent = "0";
                const oldMarkers = imageContainer.querySelectorAll('.shot-marker');
                oldMarkers.forEach(m => m.remove());
            };
            
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    // --- KLICK-LOGIK ---
    imageContainer.addEventListener('click', function(e) {
        if (!imageLoaded) return;

        const rect = imageContainer.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;

        const xPx = e.clientX - rect.left;
        const yPx = e.clientY - rect.top;

        const xPct = (xPx / rect.width) * 100;
        const yPct = (yPx / rect.height) * 100;

        const shot = { 
            x: xPct, 
            y: yPct, 
            caliber: parseFloat(caliberSelect.value) 
        };
        shots.push(shot);

        renderMarker(shot);
        shotCounter.textContent = shots.length;
    });

    function renderMarker(shot) {
        const marker = document.createElement('div');
        marker.className = 'shot-marker';
        marker.style.left = shot.x + '%';
        marker.style.top = shot.y + '%';
        
        const pixelSize = getMarkerPixelSize(shot.caliber);
        marker.style.width = pixelSize + 'px';
        marker.style.height = pixelSize + 'px';

        imageContainer.appendChild(marker);
    }

    deleteLastClick.addEventListener('click', function() {
        if (shots.length > 0) {
            shots.pop(); 
            const markers = imageContainer.querySelectorAll('.shot-marker');
            if (markers.length > 0) {
                markers[markers.length - 1].remove();
            }
            shotCounter.textContent = shots.length;
        }
    });
</script>

</body>
</html>
